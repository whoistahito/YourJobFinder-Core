# One image, two runtimes (migrate → web), reaching the prod Postgres through an
# autossh sidecar. The app is oblivious to SSH — it connects to `ssh-tunnel:5432`
# over the internal network; the sidecar holds the tunnel to the remote DB host.
#
# Env: the app reads LOWERCASE names (credential.py); the left side stays
# lowercase, the ${UPPERCASE:-default} on the right is what you set in Coolify
# (or a root .env for local). Secrets default to empty.
x-app-env: &app-env
  db_host: ssh-tunnel                  # always the sidecar — NOT configurable.
                                       # (Was ${DB_HOST:-...}, but Coolify injects
                                       # a UI var DB_HOST=db into the container,
                                       # which broke resolution. Hardcoded.)
  db_port: ${DB_PORT:-5432}
  db_name: ${DB_NAME:-postgres}
  db_username: ${DB_USERNAME:-postgres}
  db_password: ${DB_PASSWORD:-}
  cloudflare_email_token: ${CLOUDFLARE_EMAIL_TOKEN:-}
  cloudflare_account_id: ${CLOUDFLARE_ACCOUNT_ID:-}
  cloudflare_browser_token: ${CLOUDFLARE_BROWSER_TOKEN:-}
  cloudflare_email_welcome_from: ${CLOUDFLARE_EMAIL_WELCOME_FROM:-welcome@yourjobfinder.website}
  cloudflare_email_notification_from: ${CLOUDFLARE_EMAIL_NOTIFICATION_FROM:-notification@yourjobfinder.website}
  google_scraper_url: ${GOOGLE_SCRAPER_URL:-}
  google_scraper_token: ${GOOGLE_SCRAPER_TOKEN:-}
  job_matcher_url: ${JOB_MATCHER_URL:-}
  job_matcher_token: ${JOB_MATCHER_TOKEN:-}
  extractor_model: ${EXTRACTOR_MODEL:-gpt-oss-120b,glm4.7}
  judge_model: ${JUDGE_MODEL:-glm4.7}

services:
  # Holds the SSH tunnel to the remote Postgres. Listens on 0.0.0.0:5432 inside
  # the compose network; web/migrate connect to it as `ssh-tunnel:5432`.
  # The private key is read from a DIRECTORY bind mount: the key lives on the
  # backend host at /data/jobfinder/id_ed25519 (chmod 600) and the directory is
  # mounted read-only as /keys. We mount the dir (not the file) on purpose —
  # Coolify single-FILE bind mounts are buggy (created as directories); dir
  # mounts work, and this avoids Coolify's env-value truncation that mangled the
  # key when passed as SSH_KEY_B64. The matching pubkey is in the DB server's
  # root authorized_keys.
  ssh-tunnel:
    build:
      context: .
      dockerfile: tunnel.Dockerfile
    environment:
      SSH_HOST: ${SSH_HOST:-46.224.50.199}
      SSH_USER: ${SSH_USER:-root}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_DB_HOST: ${SSH_DB_HOST:-w0g84k8wcc8gww00wcw4occ4}      # DB host as seen from the bastion
      SSH_DB_PORT: ${SSH_DB_PORT:-5432}
      # Retry forever. Default gatetime (30s) makes autossh give up if ssh dies
      # within 30s of start (e.g. bastion/DB not ready at boot) → restart loop.
      AUTOSSH_GATETIME: "0"
    volumes:
      - ${SSH_KEY_DIR:-/data/jobfinder}:/keys:ro
    # ponytail: autossh/openssh baked into tunnel.Dockerfile (no apk at boot).
    # StrictHostKeyChecking=no: MITM risk on a hostile path; pin known_hosts if
    # the bastion isn't trusted.
    command:
      - sh
      - -c
      # NOTE: $$ escapes the $ so the container shell expands these (from the
      # service `environment:` above), NOT docker-compose at parse time.
      - |
        set -e
        ssh-keygen -y -f /keys/id_ed25519 >/dev/null 2>&1 || { echo "FATAL: /keys/id_ed25519 missing or not a valid key — put it on the host at \$${SSH_KEY_DIR:-/data/jobfinder}/id_ed25519 (chmod 600)"; exit 1; }
        exec autossh -M 0 -N \
          -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes \
          -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
          -i /keys/id_ed25519 -p "$$SSH_PORT" \
          -L 0.0.0.0:5432:"$$SSH_DB_HOST":"$$SSH_DB_PORT" \
          "$$SSH_USER@$$SSH_HOST"
    healthcheck:
      # busybox nc has no -z; check the forward's LISTEN socket directly.
      # 5432 = hex 1538 in /proc/net/tcp.
      test: ["CMD-SHELL", "grep -q :1538 /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Runs once per `up`, applies migrations, exits. web waits for it.
  migrate:
    build: .
    command: flask db upgrade
    environment: *app-env
    depends_on:
      ssh-tunnel:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    command: gunicorn app:app -c gunicorn_config.py
    environment: *app-env
    # Coolify's proxy reaches the container over the internal network — don't
    # publish to the host (that collides with the proxy on :8080). `expose`
    # advertises the port; set the domain → port 8080 in Coolify's UI.
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/users/_health/matches').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

# The daily scrape is no longer a resident `worker` service — main.py is now a
# one-shot. In Coolify add a Scheduled Task on this app:
#   Container: web
#   Command:   python main.py
#   Frequency: 45 10 * * *   (or the `daily` shortcut)
# https://coolify.io/docs/knowledge-base/cron-syntax
